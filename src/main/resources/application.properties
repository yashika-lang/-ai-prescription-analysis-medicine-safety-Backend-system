spring.application.name=pilie-backend
# Render injects PORT and the app must listen on it; defaults to 8080 everywhere else.
server.port=${PORT:8080}
# Render's fromDatabase-injected vars are individual host/port/database (its "connectionString"
# is a plain postgres:// URI, not a JDBC url) - composed here so both that and simple local
# dev (just DB_URL, or nothing at all) work.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pillie_db}}
spring.datasource.username=${DB_USERNAME:pillie}
spring.datasource.password=${DB_PASSWORD:pillie_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS - frontend origins allowed to call this API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Tesseract OCR - defaults are Linux-safe (Docker/Render resolve TESSERACT_DATAPATH
# themselves and don't need TESSERACT_LIBPATH at all). macOS Homebrew paths for local
# dev live in application-local.properties instead.
tesseract.datapath=${TESSERACT_DATAPATH:}
tesseract.native.libpath=${TESSERACT_LIBPATH:}

# OpenAI (RAG) - set OPENAI_API_KEY in your environment, or put it in
# application-local.properties (gitignored, spring.profiles.active=local).
# RAG endpoint reports itself unconfigured/503 without it - it never crashes the app.
openai.api.key=${OPENAI_API_KEY:}
openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}